<!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Ironia_root | Portfolio</title>
      <style>
        :root {
          --bg: #0d1117;
          --card-bg: #161b22;
          --border: #30363d;
          --text: #c9d1d9;
          --accent: #58a6ff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background-color: var(--bg);
          color: var(--text);
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 20px;
        }
        .card {
          background: var(--card-bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 32px;
          max-width: 520px;
          width: 100%;
          text-align: center;
          box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .avatar {
          width: 110px;
          height: 110px;
          border-radius: 50%;
          border: 2px solid var(--accent);
          margin-bottom: 16px;
        }
        h1 { color: #f0f6fc; font-size: 1.6rem; margin-bottom: 6px; }
        p.subtitle { color: #8b949e; margin-bottom: 20px; font-size: 0.95rem; }
        .btn {
          display: inline-block;
          padding: 10px 20px;
          background: var(--accent);
          color: #0d1117;
          font-weight: 600;
          text-decoration: none;
          border-radius: 6px;
          transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
      </style>
    </head>
    <body>
      <div class="card">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/43657686?v=4" alt="Avatar">
        <h1>Ironia_root</h1>
        <p class="subtitle">Bem-vindo à minha página oficial no GitHub Pages!</p>
        <a class="btn" href="https://github.com/IroniaTmaster" target="_blank" rel="noopener">Ver Perfil no GitHub</a>
      </div>
    </body>
    </html>
